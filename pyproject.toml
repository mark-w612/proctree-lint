[project]
name = "proctree-lint"
version = "0.1.0"
description = "A linter for indented process-tree listings."
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "mark-w612"}]

[project.scripts]
proctree-lint = "proctreelint.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["proctreelint*"]
